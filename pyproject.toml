[project]
name = "composerbench"
version = "0.1.0"
description = "Autonomous AI music composition, production, evaluation, and iteration harness controlling MAGDA externally"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary-until-license-audit" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "jsonschema>=4.18",
    "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/newmattock/ComposerBench"

[project.scripts]
composerbench = "composerbench.cli.main:main"
cbench = "composerbench.cli.main:main"

[project.optional-dependencies]
visual = ["matplotlib>=3.8,<4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
mcp = [
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["composerbench"]
artifacts = ["composerbench/devices/catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: needs a real engine or takes long"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "S110", "RUF", "SIM", "PLW1510"]
ignore = [
    "RUF001", "RUF002", "RUF003",   # music text uses ♯, ♭, × and en dashes on purpose
    "E501",                         # long tool descriptions and help strings
    "E701", "E702", "E741",         # compact one-line test helpers
    "B905", "RUF005", "RUF007", "RUF046", "SIM105",   # style-only
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110", "BLE", "PLW1510", "B017", "SIM115"]
"examples/*" = ["E402", "BLE"]
