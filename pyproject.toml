[project]
name = "composerbench"
version = "0.0.1"
description = "Autonomous AI music composition, production, evaluation, and iteration harness controlling MAGDA externally"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary-until-license-audit" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "jsonschema>=4.18",
]

[project.urls]
Repository = "https://github.com/newmattock/ComposerBench"

[project.scripts]
composerbench = "composerbench.cli.main:main"
cbench = "composerbench.cli.main:main"

[project.optional-dependencies]
visual = ["matplotlib>=3.8,<4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
mcp = [
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["composerbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
